baseURL: "https://blog.udp0.com/"
disableHugoGeneratorInject: true
defaultContentLanguage: zh-cn
hasCJKLanguage: true
title: iNetech Blog
summaryLength: 28
enableRobotsTXT: true
disableKinds:
  - taxonomy
  - term
  - section

cascade:
  - build:
      publishResources: false

minify:
  minifyOutput: true

markup:
  goldmark:
    parser:
      autoHeadingID: false
  highlight:
    codeFences: false

params:
  description: "Betterr 的个人博客，记录 Arch Linux、系统运维、网络服务、安全加固与一些随手思考。"

menus:
  main:
    - name: 首页
      url: /
      weight: 10
    - name: 服务
      pageRef: /service
      weight: 20
    - name: 留言
      pageRef: /messages
      weight: 30
    - name: 朋友
      pageRef: /links
      weight: 40
    - name: 关于我
      pageRef: /about
      weight: 50
